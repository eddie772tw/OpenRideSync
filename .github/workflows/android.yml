name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Public source and offline helper checks
        run: |
          python tools/check_public_source.py
          python -m unittest discover -s tools -p 'test_*.py'
          python -m unittest discover -s tools/validation -p 'test_*.py'
          python -m unittest discover -s tools/diagnostics -p 'test_*.py'
          node tools/auth/login_test.js
      - name: Android host tests, lint and clean APKs
        run: >
          ./gradlew --no-daemon --max-workers=2
          :diagnostics:check :honda:check :auth-bridge:check
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          -PwithHondaConfig=false -PwithOemUiAssets=false -PsourceCommit=${{ github.sha }}
      - name: Synthetic private-client configuration boundaries
        run: python tools/validation/check_client_config.py
